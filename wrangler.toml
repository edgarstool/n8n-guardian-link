# Self-managed Cloudflare Workers deployment for the n8n MCP OAuth connector.
# Overrides dist/server/wrangler.json produced by the build.
#
# Runtime storage is Supabase (see src/lib/n8n/db.server.ts and
# src/lib/n8n/api-keys.server.ts). No Cloudflare KV namespace is required.
#
# Required Worker secrets (set once, never commit values):
#   wrangler secret put SUPABASE_URL
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
# Optional (only if you later re-enable server-signed cookies):
#   wrangler secret put SESSION_SECRET
#
# Custom domain is managed by Wrangler. Cloudflare will create the DNS record
# and TLS certificate automatically on first deploy.
# WARNING: deployment fails if connect.edgars.tools already has a conflicting
# CNAME/A record. Remove the conflicting record before deploying.

name = "edgars-n8n-connector"
main = ".output/server/index.mjs"
compatibility_date = "2026-07-14"
compatibility_flags = ["nodejs_compat"]


[assets]
binding = "ASSETS"
directory = ".output/public"

[vars]
APP_BASE_URL = "https://connect.edgars.tools"
NODE_ENV = "production"

[[routes]]
pattern = "connect.edgars.tools"
custom_domain = true
